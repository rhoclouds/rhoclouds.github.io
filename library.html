<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="/icons/blazePowder32x32.png" sizes="32x32" type="image/png">
    <link rel="icon" href="/icons/blazePowder192x192.png" sizes="192x192" type="image/png">
    <link rel="apple-touch-icon" href="/icons/blazePowderAppleTouchIcon.png">
    <link rel="shortcut icon" href="/icons/blazePowder.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>library - rhoclouds</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/static-styles.css">
    <link rel="stylesheet" href="/css/nav.css">

<style>
  .container {
    width: 80%;
    max-width: 1000px;
    margin-bottom: 2rem;
  }

  .card {
  max-width: none;
  padding: 1.5rem;

  background: transparent;
  border: none;
  box-shadow: none;

  backdrop-filter: none;
  -webkit-backdrop-filter: none;

  color: var(--ink);

  overflow: visible;
}

.card::before,
.card::after {
  display: none;
}

.book-section-header {
  display: flex;
  align-items: flex-end;
  width: 100%;
}

.book-section-label {
  position: relative;

  display: inline-flex;
  align-items: center;
  gap: 16px;

  flex-shrink: 0;

  margin: 0;

  padding: 6px 16px;

  font-weight: 400;
  font-size: 1.5rem;

  color: #312d3d;

  background:
    linear-gradient(
      90deg,
      #24346c 0%,
      #4f4a83 35%,
      #9178a7 58%,
      #b392a5 71%,
      #5e567a 100%
    );

  border-radius: 6px 6px 0 6px;
}

.book-section-label::before {
  content: "✦";

  font-size: 1.2rem;

  color: #f7f2e8;
}

.book-section-header::after {
  content: "";

  flex: 1;

  height: 1px;

  background: #5e567a;
}

  .book-grid {
    display: grid;
    gap: 20px;
    margin-top: 1rem;
  }

  .shelf-1,
  .shelf-2,
  .shelf-3 {
    grid-template-columns: repeat(5, 1fr);
  }

  .book {
    background: rgba(255,255,255,0.92);
    border: 1px solid rgba(0,0,0,0.14);
    border-radius: 5px;
    overflow: hidden;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    box-shadow: 0 10px 24px rgba(0,0,0,0.18);
    aspect-ratio: 2 / 3;
  }

  .book:hover {
    transform: translateY(-5px);
    box-shadow: 0 16px 36px rgba(0,0,0,0.26);
  }

  .book img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  @media (max-width: 480px) {
    .container {
      width: 95%;
    }
  }

  @media (max-width: 640px) {
    .card {
      border-radius: 20px;
    }

    .card::before {
      border-radius: 20px 0 0 20px;
    }

    .book-grid.shelf-1,
    .book-grid.shelf-2,
    .book-grid.shelf-3 {
      grid-template-columns: repeat(3, 1fr);
    }
  }
</style>

</head>
<body>
  <div class="wrapper">

    <nav class="site-nav">
      <a href="https://rhoclouds.github.io/">home</a>
      <a href="/library.html">library</a>
      <a href="/blog.html">blog</a>
      <a href="/projects.html">projects</a>
    </nav>

    <div class="content">
      <div class="container">

        <div class="card">
          <div class="book-section-header">
            <h2 class="book-section-label">21st century novels</h2>
          </div>
          <div class="book-grid shelf-1">
            <div class="book"><img src="https://upload.wikimedia.org/wikipedia/commons/6/65/No-Image-Placeholder.svg" alt="Placeholder"></div>
            <div class="book"><img src="https://upload.wikimedia.org/wikipedia/commons/6/65/No-Image-Placeholder.svg" alt="Placeholder"></div>
            <div class="book"><img src="https://upload.wikimedia.org/wikipedia/commons/6/65/No-Image-Placeholder.svg" alt="Placeholder"></div>
            <div class="book"><img src="https://upload.wikimedia.org/wikipedia/commons/6/65/No-Image-Placeholder.svg" alt="Placeholder"></div>
            <div class="book"><img src="https://upload.wikimedia.org/wikipedia/commons/6/65/No-Image-Placeholder.svg" alt="Placeholder"></div>
          </div>
        </div>

        <div class="card">
          <div class="book-section-header">
            <h2 class="book-section-label">favorites</h2>
          </div>
          <div class="book-grid shelf-2">
            <div class="book"><img src="https://upload.wikimedia.org/wikipedia/commons/6/65/No-Image-Placeholder.svg" alt="Placeholder"></div>
            <div class="book"><img src="https://upload.wikimedia.org/wikipedia/commons/6/65/No-Image-Placeholder.svg" alt="Placeholder"></div>
            <div class="book"><img src="https://upload.wikimedia.org/wikipedia/commons/6/65/No-Image-Placeholder.svg" alt="Placeholder"></div>
            <div class="book"><img src="https://upload.wikimedia.org/wikipedia/commons/6/65/No-Image-Placeholder.svg" alt="Placeholder"></div>
            <div class="book"><img src="https://upload.wikimedia.org/wikipedia/commons/6/65/No-Image-Placeholder.svg" alt="Placeholder"></div>
          </div>
        </div>

      </div>
    </div>

  </div>
</body>
</html>
